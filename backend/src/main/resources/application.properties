# AI-Opportunity-Hub Application Configuration
spring.application.name=AI-Opportunity-Hub

# Server Port (Render dynamically assigns PORT)
server.port=${PORT:8080}

# Database Configuration
# Defaults to embedded H2 database for out-of-the-box instant execution.
# In production on Render, set SPRING_DATASOURCE_URL (or DATABASE_URL),
# SPRING_DATASOURCE_USERNAME (or DB_USERNAME), and SPRING_DATASOURCE_PASSWORD (or DB_PASSWORD).
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:opportunity_hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (available during development / testing)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Security & JWT Properties
app.jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a210987654321fedcba9a8f7e6d5c4b3a210987654321fedcba}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Configuration (Gemini API or OpenAI API)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Logging
logging.level.com.opportunity.hub=INFO

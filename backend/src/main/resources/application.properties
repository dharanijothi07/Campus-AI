# AI-Opportunity-Hub Application Configuration
spring.application.name=AI-Opportunity-Hub

# Server Port
server.port=8080

# Database Configuration (Defaults to embedded H2 database for out-of-the-box instant execution, or MySQL when configured)
# MySQL Production standard env configuration:
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/opportunity_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:opportunity_hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Properties
app.jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a210987654321fedcba9a8f7e6d5c4b3a210987654321fedcba}
app.jwt.expiration-ms=86400000

# AI Configuration (Gemini API or OpenAI API)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Logging
logging.level.com.opportunity.hub=INFO
